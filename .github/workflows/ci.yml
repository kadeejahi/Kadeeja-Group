name: CampusConnect CI

on:
  push:
    branches: [main]
  
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    name: Python Checks and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SetPython
        uses: actions/setup-python@v5
        with:
          pyton-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip Install --upgrade pip
          pip Install pytest
    
      - name: Verify Python Files exist
        run: |
          if ! find . -path './.git' -prune -o \
          -type f -name "*.py" -print | -grep -q .; then
          echo: "ERROR: No Python Files found."
            exit 1
          fi

      - name: Verify Tests Exist
        run: |
          if [ ! -d "tests" ]; then
          echo "ERROR: tests/ directory does not exist.
           exit 1
          fi

          python -m pytest --collect-only -q

      - name: Run Automated Tests
        run: |
          python -m pytest -q
        
